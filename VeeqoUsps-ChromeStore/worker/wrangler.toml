name = "veeqo-usps-auth"
main = "src/index.ts"
compatibility_date = "2026-10-19"

# KV: Google email → Veeqo OAuth token + OAuth state blobs
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[vars]
# Comma-separated Gmail addresses allowed to use the extension (override via dashboard if needed)
ALLOWED_EMAILS = "you@example.com"
# Public Worker URL used as Veeqo redirect_uri base (no trailing slash)
# PUBLIC_BASE_URL = "https://veeqo-usps-auth.YOUR_SUBDOMAIN.workers.dev"

[observability]
enabled = true

[observability.traces]
enabled = true

# Secrets (set via `wrangler secret put`):
#   VEEQO_CLIENT_ID
#   VEEQO_CLIENT_SECRET
#   STATE_SECRET
#   GOOGLE_CLIENT_ID   (Chrome extension OAuth client ID, *.apps.googleusercontent.com)
